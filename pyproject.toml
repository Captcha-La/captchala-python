[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "captchala"
version = "1.0.0"
description = "Official CaptchaLa server-side SDK for Python: validate CAPTCHA pass tokens, issue server tokens, moderate content."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "CaptchaLa", email = "supply@captcha.la" }]
keywords = ["captcha", "captchala", "bot-protection", "security", "verification", "django", "flask"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Django",
    "Framework :: Flask",
    "Framework :: AsyncIO",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
async = ["httpx>=0.23,<1"]
django = ["Django>=3.2"]
flask = ["Flask>=2.0"]
dev = ["pytest>=7", "httpx>=0.23,<1", "Django>=3.2", "Flask[async]>=2.0"]

[project.urls]
Homepage = "https://captcha.la"
Documentation = "https://docs.captcha.la/sdk/server-python"
Source = "https://github.com/Captcha-La/captchala-python"
Issues = "https://github.com/Captcha-La/captchala-python/issues"
Changelog = "https://github.com/Captcha-La/captchala-python/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
captchala = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
